<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wingo 1 Minute</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }
    header {
      background: #f44336;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #ffeaea;
      border-bottom: 1px solid #ddd;
    }
    .top-bar button {
      background: #f44336;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .game-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
    }
    .results {
      display: flex;
      gap: 5px;
    }
    .results div {
      background: #f1f1f1;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .timer-section {
      font-weight: bold;
      font-size: 16px;
      color: #f44336;
    }
    .bet-section {
      padding: 15px;
    }
    .bet-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .bet-option {
      padding: 10px;
      background: #ffeaea;
      border: 1px solid #f44336;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;
    }
    .history-section {
      padding: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background: #f44336;
      color: white;
    }
    .win {
      color: green;
      font-weight: bold;
    }
    .loss {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>Wingo 1 Minute</header>

  <div class="top-bar">
    <button onclick="location.href='withdraw.html'">Withdraw</button>
    <div>Wallet: ₹<span id="wallet">43.00</span></div>
    <button onclick="location.href='deposit.html'">Deposit</button>
  </div>

  <div class="game-info">
    <div class="results" id="lastResults"></div>
    <div class="timer-section">
      Time Left: <span id="timer">--:--</span><br>
      Period: <span id="period"></span>
    </div>
  </div>

  <div class="bet-section">
    <div class="bet-grid">
      <div class="bet-option" onclick="placeBet('Green')">Green</div>
      <div class="bet-option" onclick="placeBet('Violet')">Violet</div>
      <div class="bet-option" onclick="placeBet('Red')">Red</div>
      <div class="bet-option" onclick="placeBet('Big')">Big</div>
      <div class="bet-option" onclick="placeBet('Small')">Small</div>
      <div class="bet-option" onclick="placeBet('0')">0</div>
      <div class="bet-option" onclick="placeBet('1')">1</div>
      <div class="bet-option" onclick="placeBet('2')">2</div>
      <div class="bet-option" onclick="placeBet('3')">3</div>
      <div class="bet-option" onclick="placeBet('4')">4</div>
      <div class="bet-option" onclick="placeBet('5')">5</div>
      <div class="bet-option" onclick="placeBet('6')">6</div>
      <div class="bet-option" onclick="placeBet('7')">7</div>
      <div class="bet-option" onclick="placeBet('8')">8</div>
      <div class="bet-option" onclick="placeBet('9')">9</div>
    </div>
  </div>

  <div class="history-section">
    <h3>Game History</h3>
    <table>
      <thead><tr><th>Period</th><th>Number</th><th>Big/Small</th><th>Color</th></tr></thead>
      <tbody id="gameHistory"></tbody>
    </table>
  </div>

  <div class="history-section">
    <h3>Betting History</h3>
    <table>
      <thead><tr><th>Period</th><th>Bet</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody id="bettingHistory"></tbody>
    </table>
  </div>

  <script>
    let wallet = 43.00;
    let bettingHistory = [];
    let gameHistory = [];
    let lastRecordedMinute = -1;

    function getCurrentPeriod() {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
      return now.getFullYear().toString() +
        (now.getMonth()+1).toString().padStart(2, '0') +
        now.getDate().toString().padStart(2, '0') +
        now.getHours().toString().padStart(2, '0') +
        now.getMinutes().toString().padStart(2, '0');
    }

    function updateTimerAndResult() {
      setInterval(() => {
        const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
        const sec = now.getSeconds();
        const min = now.getMinutes();
        document.getElementById("timer").textContent = `00:${(59 - sec).toString().padStart(2, '0')}`;
        document.getElementById("period").textContent = getCurrentPeriod();

        if (sec === 0 && min !== lastRecordedMinute) {
          lastRecordedMinute = min;
          generateResult();
        }
      }, 1000);
    }

    function generateResult() {
      const result = Math.floor(Math.random() * 10);
      const color = result === 0 || result === 5 ? 'Violet' : result % 2 === 0 ? 'Red' : 'Green';
      const size = result >= 5 ? 'Big' : 'Small';
      const period = getCurrentPeriod();

      const entry = { period, number: result, color, size };
      gameHistory.unshift(entry);
      updateGameHistory();
      resolveBets(entry);
    }

    function updateGameHistory() {
      document.getElementById("gameHistory").innerHTML = gameHistory.map(g =>
        `<tr><td>${g.period}</td><td>${g.number}</td><td>${g.size}</td><td>${g.color}</td></tr>`).join('');
      document.getElementById("lastResults").innerHTML = gameHistory.slice(0, 5).map(g => `<div>${g.number}</div>`).join('');
    }

    function placeBet(value) {
      const amount = prompt("Enter amount to bet on " + value);
      if (!amount || isNaN(amount) || amount <= 0) return;
      if (wallet < amount) return alert("Insufficient balance");
      const period = getCurrentPeriod();
      bettingHistory.push({ period, value, amount: parseFloat(amount), status: "Pending" });
      wallet -= parseFloat(amount);
      updateWallet();
      updateBettingTable();
    }

    function resolveBets(entry) {
      for (let bet of bettingHistory) {
        if (bet.period === entry.period && bet.status === "Pending") {
          const isWin = bet.value == entry.number || bet.value == entry.color || bet.value == entry.size;
          const isNumber = !isNaN(parseInt(bet.value));
          if (isWin) {
            const multiplier = isNumber ? 8.8 : 1.98;
            wallet += parseFloat(bet.amount) * multiplier;
            bet.status = `<span class='win'>Win (x${multiplier})</span>`;
          } else {
            bet.status = "<span class='loss'>Loss</span>";
          }
        }
      }
      updateWallet();
      updateBettingTable();
    }

    function updateWallet() {
      document.getElementById("wallet").textContent = wallet.toFixed(2);
    }

    function updateBettingTable() {
      document.getElementById("bettingHistory").innerHTML = bettingHistory.slice().reverse().map(b =>
        `<tr><td>${b.period}</td><td>${b.value}</td><td>${b.amount}</td><td>${b.status}</td></tr>`).join('');
    }

    updateTimerAndResult();
    updateWallet();
  </script>
</body>
</html>
